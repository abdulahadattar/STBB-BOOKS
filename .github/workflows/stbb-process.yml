name: STBB Biology 9-12 Processor

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      start_id:
        description: "Optional: start from specific book id"
        required: false
        default: ""

jobs:
  process-biology:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout with sparse pattern
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            README.md
            book_list.json
            progress.json
            jpegs_to_pdf.py
            upload_one_book.py
            Grade 9/Biology/
            Grade 10/Biology/
            Grade 11/Biology/
            Grade 12/Biology/
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y poppler-utils
          pip install pymupdf

      - name: Pick next Biology book
        id: pick_book
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import json, os, re, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          headers = {'Authorization': f'token {token}', 'Accept': 'application/vnd.github.v3+json'}

          def api(path):
            req = urllib.request.Request(f'https://api.github.com/repos/{repo}{path}', headers=headers)
            with urllib.request.urlopen(req) as r:
              return json.load(r)

          with open('progress.json') as f:
            progress = json.load(f)

          with open('book_list.json') as f:
            books = json.load(f)

          bio_books = []
          for grade in ['Grade 9','Grade 10','Grade 11','Grade 12']:
            for b in books.get(grade, []):
              if b.get('subject','').lower() != 'biology':
                continue
              pid = str(b['id'])
              st = progress.get(pid, {})
              if st.get('status') in ('done', 'uploaded'):
                continue
              bio_books.append(b)

          if not bio_books:
            print('No Biology books to process')
            exit(0)

          book = bio_books[0]
          print(f'PICKED|{book[\"id\"]}|{book[\"title\"]}|{book.get(\"grade\",\"\")}|{book.get(\"subject\",\"\")}')
          "

      - name: Process Biology book
        id: process
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 upload_one_book.py ${{ steps.pick_book.outputs.BOOK_ID }} "${{ steps.pick_book.outputs.BOOK_TITLE }}" "${{ steps.pick_book.outputs.BOOK_GRADE }}" "${{ steps.pick_book.outputs.BOOK_SUBJECT }}"

      - name: Commit and push Biology chapters
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "agent@users.noreply.github.com"
          git config user.name "STBB Agent"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Add Biology: ${{ steps.pick_book.outputs.BOOK_TITLE }} (${{ steps.pick_book.outputs.BOOK_GRADE }})"
          git push

      - name: Trigger next Biology book
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          headers = {'Authorization': f'token {token}', 'Accept': 'application/vnd.github.v3+json'}
          url = f'https://api.github.com/repos/{repo}/issues'
          data = json.dumps({'title': 'STBB auto: process next Biology book', 'body': 'Auto-triggered after previous Biology book finished.', 'labels': [{'name': 'auto-trigger'}]}).encode()
          req = urllib.request.Request(url, data=data, headers=headers)
          try:
            urllib.request.urlopen(req)
          except Exception as e:
            print('Issue creation failed:', e)
          "
